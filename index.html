<title>Arab tili daraja testi</title>

<style>
:root{--bg:#f7f2e7;--card:#fffdf8;--ink:#1f2a25;--mut:#6b746f;--line:#e6dcc7;--pri:#1f5f4a;--pri2:#2a7a60;--gold:#c49a3a;--ok:#2a7a4a;--bad:#b4442f;--sel:#e7f1ec}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
.ar,[lang=ar]{font-family:"Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.brand{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px}
.brand b{display:block;font-size:17px}.brand small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}
p{margin:6px 0}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:17px}
input:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
textarea{min-height:170px;resize:vertical;font-family:"Noto Naskh Arabic",serif;font-size:20px;line-height:1.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:600 17px Inter,sans-serif;cursor:pointer;margin-top:16px;box-shadow:0 4px 14px rgba(31,95,74,.25)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line);box-shadow:none}
.err{color:var(--bad);font-size:14px;margin-top:8px}
ul.rules{padding-left:20px;margin:8px 0}ul.rules li{margin:5px 0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin-bottom:6px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{background:var(--pri);color:#fff;border-radius:8px;padding:3px 10px;font-weight:700;font-size:14px}
.sec{color:var(--mut);font-size:14px;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:3px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.timer.low{color:#fff;background:var(--bad);border-color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.ins{color:var(--mut);font-size:15px;margin-bottom:8px}
.q{font-size:19px;font-weight:600;margin-bottom:14px}
.q .ar,.opt .ar{font-size:23px;font-weight:500}
.rtl{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic",serif}
.rtl .q{font-size:23px;font-weight:600}
.text{font-family:"Noto Naskh Arabic",serif;direction:rtl;text-align:justify;font-size:21px;line-height:2;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:42vh;overflow:auto;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:start;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;cursor:pointer}
.rtl .opt{font-family:"Noto Naskh Arabic",serif;font-size:21px;text-align:right}
.opt.on{border-color:var(--pri);background:var(--sel);font-weight:600}
.hint{background:var(--sel);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.built{min-height:64px;border:1.5px dashed var(--pri);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin-bottom:12px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
.chip{font-family:"Noto Naskh Arabic",serif;font-size:21px;padding:6px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.built .chip{background:var(--sel);border-color:var(--pri)}
.chip.used{visibility:hidden}
.tin{direction:rtl;font-family:"Noto Naskh Arabic",serif;font-size:24px;text-align:right}
.kb{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:10px;direction:rtl}
.kb button{padding:9px 0;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:500 19px "Noto Naskh Arabic",serif;cursor:pointer}
.kb button.w2{grid-column:span 2;font:600 14px Inter,sans-serif}
.kb button.w4{grid-column:span 4;font:600 14px Inter,sans-serif}
.kbt{background:none;border:0;color:var(--pri);font:600 14px Inter,sans-serif;cursor:pointer;padding:6px 0;margin-top:6px}
.big{font-size:44px;font-weight:800;color:var(--pri);margin:4px 0}
.center{text-align:center}
.muted{color:var(--mut);font-size:14px}
.foot{color:var(--mut);text-align:center;font-size:13px;margin-top:20px}
</style>
</head>

 free:'اكتب مقالة قصيرة بعنوان «اللغة والهوية»: هل اللغة مجرد وسيلة للتواصل أم هي جزء من هوية الإنسان؟ (فقرتان على الأقل)'
}
];

// ====== YORDAMCHI ======
const $ = s=>document.querySelector(s);
const app = $('#app');
const N = s=>String(s||'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[.,،؟?!«»:؛()\-_]/g,' ').replace(/\s+/g,' ').trim();
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isAr = s=>/[؀-ۿ]/.test(s);
const optHtml = s=>isAr(s)?`<span class=ar>${s}</span>`:esc(s);
const KEY='daraja-testi-v1';
const store = {get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}};

let S = {info:null, stages:[], li:0, items:[], idx:0, ans:[], tEnd:0, timer:null, t0:0};

function brand(){return `<div class="brand"><div class="logo">ع</div><div><b>Arab tili daraja testi</b><small>Tabassum · onlayn markaz</small></div></div>`}

// ====== 1. BOSHLASH ======
function startScreen(){
  const old = store.get();
  if(old && old.done){ return resultScreen(old.done, true); }
  if(old && old.prog){ return resume(old.prog); }
  app.innerHTML = brand()+`
  <div class="card"><h1>Assalomu alaykum!</h1>
  <p>Bu test arab tilini qaysi darajada bilishingizni aniqlaydi: <b>A0 dan C2 gacha</b>.</p>
  <p class="muted">Avval ma'lumotlaringizni yozing.</p>
  <label>Ism va familiya</label><input id="f_name" autocomplete="name" placeholder="Masalan: Aziz Karimov">
  <label>Yoshingiz</label><input id="f_age" inputmode="numeric" placeholder="Masalan: 19">
  <label>Telefon raqam</label><input id="f_phone" type="tel" autocomplete="tel" placeholder="+998 90 123 45 67">
  <label>Telegram username</label><input id="f_tg" placeholder="@username">
  <div class="err" id="f_err"></div>
  <button class="btn" id="go">Davom etish →</button></div>
  <div class="foot">Tabassum arab tili markazi</div>`;
  $('#go').onclick=()=>{
    const v={name:$('#f_name').value.trim(),age:$('#f_age').value.trim(),phone:$('#f_phone').value.trim(),tg:$('#f_tg').value.trim()};
    if(v.name.length<3) return $('#f_err').textContent="Ism va familiyangizni yozing.";
    if(!/^\d{1,2}$/.test(v.age)) return $('#f_err').textContent="Yoshingizni raqam bilan yozing.";
    if(v.phone.replace(/\D/g,'').length<9) return $('#f_err').textContent="Telefon raqamni to'liq yozing.";
    if(v.tg && v.tg[0]!=='@') v.tg='@'+v.tg;
    S.info=v; persist('rules'); rulesScreen();
  };
}

function rulesScreen(){
  app.innerHTML = brand()+`<div class="card"><h2>Test qanday o'tadi?</h2>
  <ul class="rules">
   <li>Test <b>A0</b> darajadan boshlanadi va asta-sekin qiyinlashadi.</li>
   <li>Har bosqichda <b>16 ta savol</b> bor: qoida (6), o'qish (5), yozish (5).</li>
   <li>Har bosqichning o'z <b>vaqti</b> bor. Vaqt tugasa, bosqich o'zi yakunlanadi.</li>
   <li>Bosqichdan <b>80%</b> olsangiz, keyingi darajaga o'tasiz. Ololmasangiz, test shu yerda tugaydi.</li>
   <li>Oxirida o'z darajangizda <b>qisqa matn</b> yozasiz. Uni ustoz o'zi tekshiradi.</li>
   <li>Javob berib bo'lgach, orqaga qaytib bo'lmaydi.</li>
   <li>Lug'at, tarjimon yoki boshqa yordamdan foydalanmang. Shunda sizga to'g'ri guruh tanlanadi.</li>
   <li>A0 bosqichi o'zbekcha, A1 dan boshlab savollar arabcha bo'ladi.</li>
  </ul>
  <p class="muted">Arabcha yozish uchun ekranda harflar tugmasi bor.</p>
  <button class="btn" id="go">Testni boshlash</button></div>`;
  $('#go').onclick=()=>{S.t0=Date.now(); stageIntro(0)};
}

// ====== 2. BOSQICH ======
function buildItems(lv){
  const it=[];
  lv.g.forEach(g=>it.push({sec:0,kind:'mc',p:g[0],ok:g[1],opts:shuf(g.slice(1))}));
  lv.r.q.forEach(q=>it.push({sec:1,kind:'mc',p:q[0],ok:q[1],opts:shuf(q.slice(1)),text:lv.r.text}));
  lv.w.forEach(w=>{
    if(w.t==='order') it.push({sec:2,kind:'order',hint:w.hint,alts:w.ans,words:shuf(w.ans[0].split(' '))});
    else if(w.t==='type') it.push({sec:2,kind:'type',p:w.p,alts:w.a});
    else it.push({sec:2,kind:'mc',p:w.p,ok:w.o[0],opts:shuf(w.o)});
  });
  return it;
}

// ====== DAVOM ETTIRISH (chiqib ketsa) ======
function persist(phase,extra){
  S.phase=phase;
  const p={phase,info:S.info,stages:S.stages,li:S.li,items:S.items,idx:S.idx,ans:S.ans,tEnd:S.tEnd,t0:S.t0,fEnd:S.fEnd,draft:S.draft};
  store.set({prog:p});
}
function resume(p){
  Object.assign(S,{info:p.info,stages:p.stages||[],li:p.li||0,items:p.items||[],idx:p.idx||0,ans:p.ans||[],tEnd:p.tEnd||0,t0:p.t0||Date.now(),fEnd:p.fEnd,draft:p.draft||'',phase:p.phase});
  if(p.phase==='rules') return rulesScreen();
  if(p.phase==='intro') return stageIntro(S.li);
  if(p.phase==='free') return freeScreen();
  if(p.phase==='stage'){
    if(Date.now()>=S.tEnd){ saveCur(); return finishStage(true); }
    clearInterval(S.timer); S.timer=setInterval(tick,1000);
    return renderItem();
  }
  startScreen();
}

function stageIntro(li){
  const lv=L[li]; S.li=li; persist('intro');
  const prev = li>0 ? `<p>✅ <b>${L[li-1].id}</b> bosqichi muvaffaqiyatli tugadi!</p>` : '';
  app.innerHTML = brand()+`<div class="card center">${prev}
   <p class="muted">Keyingi bosqich</p><div class="big">${lv.id}</div>
   <p>16 ta savol · ${lv.time/60} daqiqa</p>
   <button class="btn" id="go">Boshlash</button></div>`;
  $('#go').onclick=()=>runStage(li);
}

function runStage(li){
  S.li=li; S.items=buildItems(L[li]); S.idx=0; S.ans=new Array(S.items.length).fill(null);
  S.tEnd=Date.now()+L[li].time*1000;
  clearInterval(S.timer); S.timer=setInterval(tick,1000);
  persist('stage');
  renderItem();
}
function tick(){
  const left=Math.max(0,Math.round((S.tEnd-Date.now())/1000));
  const el=$('#tm'); if(el){el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'); el.classList.toggle('low',left<=60);}
  if(left<=0 && S.phase==='stage'){clearInterval(S.timer); saveCur(); finishStage(true);}
}

function renderItem(){
  const lv=L[S.li], it=S.items[S.idx], uz=!!lv.uz;
  const ins = it.kind==='order'?lv.ins.o : it.sec===1?lv.ins.r : lv.ins.g;
  let body='';
  if(it.text) body+=`<div class="text">${it.text}</div>`;
  if(it.kind==='mc'){
    body+=`<div class="q" dir="auto">${it.p}</div><div class="opts">`+
      it.opts.map((o,i)=>`<button class="opt${it.sel===i?' on':''}" data-i="${i}" dir="auto">${uz?optHtml(o):o}</button>`).join('')+`</div>`;
  } else if(it.kind==='order'){
    if(it.hint) body+=`<div class="hint">${esc(it.hint)}</div>`;
    body+=`<div class="built" id="built"></div><div class="pool">`+
      it.words.map((w,i)=>`<button class="chip" data-w="${i}">${w}</button>`).join('')+`</div>`;
    it.pick=it.pick||[];
  } else {
    body+=`<div class="q" dir="auto">${it.p}</div><input class="tin" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" dir="rtl" value="${esc(it.val||'')}">`+kbHtml();
  }
  const secName = lv.ins.sec[it.sec];
  app.innerHTML = `<div class="top"><div class="toprow"><span class="badge">${lv.id}</span><span class="sec ${uz?'':'ar'}">${secName} · ${S.idx+1}/16</span><span class="timer" id="tm">--:--</span></div><div class="bar"><i style="width:${S.idx/16*100}%"></i></div></div>
  <div class="card ${uz?'':'rtl'}"><div class="ins ${uz?'':'ar'}">${ins}</div>${body}</div>
  <button class="btn" id="next">${S.idx===S.items.length-1?'Bosqichni yakunlash':'Keyingi →'}</button>`;
  if(it.kind==='mc'){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{app.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');it.sel=+b.dataset.i;persist('stage');});
  } else if(it.kind==='order'){
    const drawBuilt=()=>{
      $('#built').innerHTML=it.pick.map((wi,k)=>`<button class="chip" data-k="${k}">${it.words[wi]}</button>`).join('');
      app.querySelectorAll('.pool .chip').forEach(c=>c.classList.toggle('used',it.pick.includes(+c.dataset.w)));
      $('#built').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{it.pick.splice(+c.dataset.k,1);drawBuilt();});
      persist('stage');
    };
    app.querySelectorAll('.pool .chip').forEach(c=>c.onclick=()=>{const w=+c.dataset.w; if(!it.pick.includes(w)){it.pick.push(w);drawBuilt();}});
    drawBuilt();
  } else { const tin=$('#tin'); bindKb(tin); tin.addEventListener('input',()=>{it.val=tin.value;persist('stage');}); }
  $('#next').onclick=()=>{saveCur(); if(S.idx<S.items.length-1){S.idx++;persist('stage');renderItem();window.scrollTo(0,0);} else finishStage(false);};
  tick();
}

function saveCur(){
  const it=S.items[S.idx]; if(!it) return;
  if(it.kind==='mc') S.ans[S.idx] = it.sel==null?null:it.opts[it.sel];
  else if(it.kind==='order') S.ans[S.idx] = (it.pick||[]).map(i=>it.words[i]).join(' ');
  else { const el=$('#tin'); S.ans[S.idx] = el?el.value:(it.val||''); }
}
function isRight(it,a){
  if(a==null||a==='') return false;
  if(it.kind==='mc') return a===it.ok;
  return it.alts.some(x=>N(x)===N(a));
}

function finishStage(timeout){
  clearInterval(S.timer);
  const lv=L[S.li];
  let score=0; S.items.forEach((it,i)=>{if(isRight(it,S.ans[i])) score++;});
  const secs=[0,0,0]; S.items.forEach((it,i)=>{if(isRight(it,S.ans[i])) secs[it.sec]++;});
  const pass = score >= Math.ceil(S.items.length*PASS);
  S.stages.push({id:lv.id,score,total:S.items.length,secs,pass,timeout,
    wrong:S.items.map((it,i)=>isRight(it,S.ans[i])?null:i+1).filter(Boolean)});
  S.items=[]; S.ans=[]; S.idx=0;
  if(pass && S.li<L.length-1) stageIntro(S.li+1);
  else { S.fEnd=Date.now()+10*60*1000; S.draft=''; freeScreen(); }
}

// ====== 3. ERKIN MATN ======
function achieved(){ const p=S.stages.filter(s=>s.pass); return p.length?p[p.length-1].id:null; }
function freeScreen(){
  const a=achieved(); const lv=L.find(l=>l.id===(a||'A0'));
  const uz=!!lv.uz;
  if(!S.fEnd) S.fEnd=Date.now()+10*60*1000;
  const tEnd=S.fEnd; let left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  persist('free');
  app.innerHTML = brand()+`<div class="card"><h2>Oxirgi qism: erkin yozish</h2>
   <p class="muted">Quyidagi mavzuda arabcha yozing. Bu qismni ustoz o'zi tekshiradi. Vaqt: 10 daqiqa · <b id="ftm">10:00</b></p>
   <div class="hint ${uz?'':'rtl'}" style="font-size:${uz?15:20}px">${esc(lv.free)}</div>
   <textarea id="ft" dir="rtl" placeholder="اُكْتُبْ هُنَا..."></textarea>${kbHtml()}
   <button class="btn" id="send">Yakunlash va yuborish</button></div>`;
  const ft=$('#ft'); ft.value=S.draft||''; bindKb(ft);
  ft.addEventListener('input',()=>{S.draft=ft.value;persist('free');});
  const t=setInterval(()=>{left=Math.max(0,Math.round((tEnd-Date.now())/1000));const e=$('#ftm');if(e)e.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'); if(left<=0){clearInterval(t);go();}},1000);
  let sent=false;
  const go=async()=>{
    if(sent) return; sent=true; clearInterval(t);
    const txt=($('#ft')||{}).value||'';
    const b=$('#send'); if(b){b.disabled=true;b.textContent='Yuborilmoqda...';}
    const res=makeResult(lv,txt);
    res.sent = await sendTg(res);
    store.set({done:res});
    resultScreen(res,false);
  };
  $('#send').onclick=go;
}

function levelInfo(a){
  if(!a) return {lvl:'A0 dan past', rec:"A0 (boshidan)"};
  const i=L.findIndex(l=>l.id===a);
  return {lvl:a, rec: i<L.length-1 ? L[i+1].id : 'C2 (eng yuqori)'};
}
function makeResult(lv,txt){
  const a=achieved(), li=levelInfo(a);
  return {info:S.info, level:li.lvl, rec:li.rec, stages:S.stages, freeLvl:lv.id, freeTopic:lv.free, text:txt,
    mins:Math.round((Date.now()-S.t0)/60000), date:new Date().toLocaleString('uz-UZ')};
}

async function sendTg(r){
  if(!BOT_TOKEN||!CHAT_ID) return false;
  const st=r.stages.map(s=>`${s.pass?'✅':'❌'} ${s.id}: ${s.score}/${s.total} (qoida ${s.secs[0]}/6, o'qish ${s.secs[1]}/5, yozish ${s.secs[2]}/5)${s.timeout?' ⏱vaqt tugadi':''}${s.wrong.length?'\n     xato: '+s.wrong.join(', '):''}`).join('\n');
  const msg=`🧪 <b>Yangi daraja testi</b>
👤 <b>${esc(r.info.name)}</b>, ${esc(r.info.age)} yosh
📞 ${esc(r.info.phone)}
✈️ ${esc(r.info.tg||'—')}

🏅 <b>Daraja: ${r.level}</b>
📚 Tavsiya: <b>${r.rec}</b> dan boshlash
⏱ ${r.mins} daqiqa · ${esc(r.date)}

📊 Bosqichlar:
${st}

✍️ <b>Erkin matn</b> (${r.freeLvl}):
<i>${esc(r.freeTopic)}</i>

${esc(r.text.trim()||'— (yozmadi)').slice(0,2800)}`;
  try{
    const resp=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT_ID,text:msg,parse_mode:'HTML'})});
    const j=await resp.json(); return !!j.ok;
  }catch(e){return false}
}

// ====== 4. NATIJA ======
function resultScreen(r,again){
  app.innerHTML = brand()+`<div class="card center">
   <p class="muted">${esc(r.info.name)}, sizning darajangiz</p>
   <div class="big">${r.level}</div>
   <p>Tavsiya: <b>${r.rec}</b> guruhidan boshlash</p>
   <p class="muted">Erkin yozgan matningizni ustoz tekshirib, aniq guruhni aytadi.</p>
   ${r.sent?`<p>✅ Natijangiz ustozga yuborildi.</p>`:`<p class="err">⚠️ Natija avtomatik yuborilmadi. Iltimos, shu ekranni <b>skrinshot</b> qilib ustozga yuboring.</p>`}
   <p class="muted">${esc(r.date)}${again?' · test avval topshirilgan':''}</p>
   ${!r.sent?`<button class="btn ghost" id="retry">Qayta yuborish</button>`:''}
  </div><div class="foot">Tabassum arab tili markazi</div>`;
  const rb=$('#retry'); if(rb) rb.onclick=async()=>{rb.disabled=true;rb.textContent='Yuborilmoqda...';r.sent=await sendTg(r);store.set({done:r});resultScreen(r,again);};
}

// ====== ARABCHA KLAVIATURA ======
function kbHtml(){
  const rows='ض ص ث ق ف غ ع ه خ ح ج ش س ي ب ل ا ت ن م ك ط ذ ئ ء ؤ ر ى ة و ز ظ د أ إ آ'.split(' ');
  return `<button class="kbt" type="button" data-kbt>⌨️ Arabcha harflar</button><div class="kb" hidden>`+
    rows.map(c=>`<button type="button" data-c="${c}">${c}</button>`).join('')+
    `<button type="button" class="w4" data-c=" ">bo'shliq</button><button type="button" class="w2" data-del>⌫</button></div>`;
}
function bindKb(inp){
  const kb=app.querySelector('.kb'), t=app.querySelector('[data-kbt]');
  t.onclick=()=>{kb.hidden=!kb.hidden;};
  kb.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(b.dataset.del!=null) inp.value=inp.value.slice(0,-1);
    else inp.value+=b.dataset.c;
  });
}

startScreen();
</script>
</body>
</html>
